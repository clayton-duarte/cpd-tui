# cpd.conf — dedicated config for the `cpd` tmux server.
# Loaded with `-f` by bin/cpd so that `-L cpd` (a custom socket) does NOT
# silently inherit the user's ~/.tmux.conf (verified: it does, unless -f wins).

set -g exit-empty off                       # server must outlive the last client
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"          # NOTE: -ga, not -g; -g drops auto-detected features
set -g extended-keys on
set -g extended-keys-format csi-u           # so Shift+Enter is distinguishable
set -g escape-time 10
set -g mouse on
set -g base-index 0
set -g pane-base-index 0

# Visual identity so the user can tell at a glance this is the cpd server,
# not their own default tmux (dark, tasteful).
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=colour114,bold] cpd #[default]"
set -g status-left-length 10
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour114"
